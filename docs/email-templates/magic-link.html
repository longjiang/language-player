<!DOCTYPE html>

            </tr>
            <tr>

            </tr>
            <tr>

              </td>
            </tr>
<tr>

      style="display:inline-block;background-color:#69279c;color:#ffffff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;font-weight:600;line-height:1;text-decoration:none;padding:16px 32px;border-radius:10px;">
      Sign in
    </a>
  </td>
</tr>
<tr>
  <td align="center" style="padding:28px 40px 4px 40px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">

        <td style="border-bottom:1px solid #e8ecf5;font-size:0;line-height:0;">&nbsp;</td>
      </tr>
    </table>
  </td>
</tr>
            <tr>
              <td align="center" bgcolor="#f8fafc" style="background-color:#f8fafc;border-top:1px solid #e8ecf5;padding:24px 32px;">

                <p style="margin:8px 0 0 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;">
