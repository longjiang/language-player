plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.rubytext'
version = '0.1.0'

android {
  namespace "expo.modules.rubytext"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // RubyTextParagraphView extends AppCompatTextView (SPEC-084 Task 2 rewrite).
  // Declared here because appcompat is not transitively exposed to this
  // module's compile classpath (it is `implementation` in other modules).
  implementation 'androidx.appcompat:appcompat:1.7.1'
}
