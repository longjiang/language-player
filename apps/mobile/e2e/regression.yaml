appId: ca.zerotohero.app
---
# ════════════════════════════════════════════════════════════════════
# Full Regression Suite
# ════════════════════════════════════════════════════════════════════
#
# Run locally:
#   maestro test apps/mobile/e2e/regression.yaml
#
# ⚠️  Must run from a CLEAN simulator state:
#   xcrun simctl uninstall booted ca.zerotohero.app
#   xcrun simctl install booted <path>/ZeroToHero.app
#
# ⚠️  Tests are ORDER-DEPENDENT. The auth suite creates a new user
# account and logs in, establishing state that subsequent suites
# depend on. Do not reorder without updating preflight checks.
# ════════════════════════════════════════════════════════════════════

# ── Tier 0: Smoke (pre-commit gate, ~30s) ─────────────────────────
- runFlow:
    file: smoke.yaml

# ── Tier 1: Auth & Onboarding (~5min) ──────────────────────────────
- runFlow:
    file: screens/auth.yaml

# ── Tier 2: Media Tab (~10min) — not yet implemented ───────────────
# - runFlow:
#     file: screens/explore.yaml

# ── Tier 3: Dictionary & Vocab (~10min) — not yet implemented ──────
# - runFlow:
#     file: screens/dictionary.yaml

