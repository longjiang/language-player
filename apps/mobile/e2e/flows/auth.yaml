appId: ca.zerotohero.app
---
# ── Login flow ──────────────────────────────────────────────────────
login:
  - assertVisible:
      id: "login-email-input"
  - tapOn:
      id: "login-email-input"
  - inputText: ${EMAIL}
  - tapOn:
      id: "login-password-input"
  - inputText: ${PASS}
  - tapOn:
      id: "login-signin-button"
  - waitFor:
      notVisible:
        id: "login-signin-button"
      timeout: ${TIMEOUT}

# ── Logout flow ─────────────────────────────────────────────────────
logout:
  - tapOn:
      id: "me-logout-button"
  - assertVisible:
      id: "login-email-input"

# ── Register flow ───────────────────────────────────────────────────
register:
  - assertVisible:
      id: "register-firstname-input"
  - tapOn:
      id: "register-firstname-input"
  - inputText: ${FIRST_NAME}
  - tapOn:
      id: "register-lastname-input"
  - inputText: ${LAST_NAME}
  - tapOn:
      id: "register-email-input"
  - inputText: ${EMAIL}
  - tapOn:
      id: "register-password-input"
  - inputText: ${PASS}
  - tapOn:
      id: "register-confirm-password-input"
  - inputText: ${PASS}
  - tapOn:
      id: "register-create-button"
  - waitFor:
      notVisible:
        id: "register-create-button"
      timeout: ${TIMEOUT}
