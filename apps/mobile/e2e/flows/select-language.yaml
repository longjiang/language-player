appId: ca.zerotohero.app
---
# ════════════════════════════════════════════════════════════════════
# Language Selection (Onboarding)
#
# Used by A12 (select language after registration) and can be reused
# by any flow that needs to set the user's language preferences.
#
# Prerequisite: LanguagePicker is visible with L1 tab active.
# Postcondition: user is on main tabs (me-logout-button visible).
#
# Selects English (en) as L1 and Spanish (es) as L2.
# ════════════════════════════════════════════════════════════════════

# Select English (en) as L1 — only scroll if not already visible at top
# NOTE: Fabric combines name + code into "English, EN" — use exact accessibilityText
- runFlow:
    when:
      notVisible:
        text: "English, EN"
    commands:
      - scrollUntilVisible:
          element:
            text: "English, EN"
          direction: DOWN
          timeout: 5000
          speed: 40
- tapOn:
    text: "English, EN"

# Tap "Next" to go to L2 tab
- assertVisible:
    id: "picker-next-button"
- tapOn:
    id: "picker-next-button"

# Select Spanish (es) as L2 — only scroll if not already visible at top
- assertVisible:
    id: "picker-l2-tab"
- runFlow:
    when:
      notVisible:
        text: "Spanish, ES"
    commands:
      - scrollUntilVisible:
          element:
            text: "Spanish, ES"
          direction: DOWN
          timeout: 5000
          speed: 40
- tapOn:
    text: "Spanish, ES"

# Tap "Confirm" to finish onboarding
- assertVisible:
    id: "picker-confirm-button"
- tapOn:
    id: "picker-confirm-button"
