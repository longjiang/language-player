appId: ca.zerotohero.go
---
# ════════════════════════════════════════════════════════════════════
# Reusable login flow using Mary's test credentials.
#
# `eraseText` clears the field before typing. Works reliably with
# React Native TextInput under Fabric — focus with tapOn, then
# eraseText (up to 50 chars via simulated backspace), then inputText.
#
# Prerequisite: login screen is visible (login-email-input).
# Postcondition: user is authenticated, logged in (header-logo visible).
# ════════════════════════════════════════════════════════════════════
- assertVisible:
    id: "login-email-input"
- tapOn:
    id: "login-email-input"
- eraseText
- inputText: "tester.mary@zerotohero.ca"
- tapOn:
    id: "login-password-input"
- eraseText
- inputText: "pc8qm8LBZeGuBno"
# Dismiss keyboard before tapping sign-in button
- tapOn:
    id: "dismiss-keyboard"
- tapOn:
    id: "login-signin-button"
- assertVisible:
    id: "header-logo"
