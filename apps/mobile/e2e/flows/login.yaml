appId: ca.zerotohero.app
---
# ════════════════════════════════════════════════════════════════════
# Reusable login flow using Mary's test credentials.
#
# ⚠️  `repeat: 3` before `inputText` selects all existing text so
# the new value replaces rather than appends. Required because
# `eraseText` is unreliable under Fabric.
#
# Prerequisite: login screen is visible (login-email-input).
# Postcondition: user is authenticated, me-logout-button is visible.
# ════════════════════════════════════════════════════════════════════
- assertVisible:
    id: "login-email-input"
- tapOn:
    id: "login-email-input"
    repeat: 3
- inputText: "tester.mary@zerotohero.ca"
- tapOn:
    id: "login-password-input"
    repeat: 3
- inputText: "pc8qm8LBZeGuBno"
# Dismiss keyboard before tapping sign-in button
- hideKeyboard
- tapOn:
    id: "login-signin-button"
- assertVisible:
    id: "me-logout-button"
