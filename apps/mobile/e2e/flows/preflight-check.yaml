appId: ca.zerotohero.go
---
# ════════════════════════════════════════════════════════════════════
# Preflight Check
#
# Ensures the app is on the login screen before running tests, from
# any starting state:
#
# 1. Register screen visible → tap "Already have an account?" link
# 2. Authenticated (tabs visible) → run logout flow
# 3. Login screen visible → proceed (no action needed)
#
# iOS Keychain tokens survive app relaunch, so this handles stale
# auth tokens from a previous test run.
# ════════════════════════════════════════════════════════════════════

# ── Handle register screen: tap "Already have an account?" ──────
# The register screen has a back-to-login link at the bottom.
# More reliable than swiping or tapping the iOS navigation bar.
- runFlow:
    when:
      visible:
        id: "register-firstname-input"
    commands:
      - tapOn:
          id: "register-back-to-login"
          label: "Back to Login from register screen"

# ── Handle authenticated state: log out ─────────────────────────
- runFlow:
    when:
      notVisible:
        id: "login-email-input"
    commands:
      - runFlow:
          file: logout.yaml
