appId: ca.zerotohero.app
---
# Verify we're on the login screen; if not, log out first.
# iOS Keychain tokens survive app relaunch, so this handles the case
# where a previous test left a logged-in session behind.
#
# Runs flows/logout.yaml conditionally — only when the login screen
# is NOT visible (i.e., a stale auth token keeps the user logged in).
- runFlow:
    file: flows/logout.yaml
    when:
      notVisible:
        id: "login-email-input"
