appId: ca.zerotohero.app
---
# ════════════════════════════════════════════════════════════════════
# Preflight Check
#
# Ensures the app is on the login screen before running tests, from
# any starting state:
#
# 1. Register screen visible → tap iOS navigation back button (top-left)
# 2. Authenticated (tabs visible) → run logout flow
# 3. Login screen visible → proceed (no action needed)
#
# iOS Keychain tokens survive app relaunch, so this handles stale
# auth tokens from a previous test run.
# ════════════════════════════════════════════════════════════════════

# ── Handle register screen: tap iOS back button ─────────────────
# If a register test left us on the register screen, tap the top-left
# area where Expo Router's stack navigator places the back chevron.
- runFlow:
    when:
      visible:
        id: "register-firstname-input"
    commands:
      - tapOn:
          point: "3%,6%"
      - waitForAnimationToEnd

# ── Handle authenticated state: log out ─────────────────────────
- runFlow:
    when:
      notVisible:
        id: "login-email-input"
    commands:
      - runFlow:
          file: logout.yaml
