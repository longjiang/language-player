appId: ca.zerotohero.go
---
# ════════════════════════════════════════════════════════════════════
# Reusable logout flow.
#
# Prerequisite: user is authenticated (header-logo visible).
# Postcondition: login screen visible (login-email-input).
#
# Opens the user menu and taps Logout. Both steps are optional: true
# so the flow gracefully skips if already logged out.
# ════════════════════════════════════════════════════════════════════
- tapOn:
    id: "header-user-menu"
    optional: true
- tapOn:
    id: "header-user-menu-logout"
    optional: true
- assertVisible:
    id: "login-email-input"
