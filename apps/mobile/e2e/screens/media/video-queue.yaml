appId: ca.zerotohero.go
---
# ════════════════════════════════════════════════════════════════════
# M14: Video queue
# ════════════════════════════════════════════════════════════════════
# Login → Media tab → tap video → tap the queue tab in the panel →
# assert queue renders (may be empty — that's valid for a fresh session).

# ── Ensure on Explore screen (login if needed) ──────────────────────
- runFlow:
    file: ../../flows/ensure-explore.yaml

# ── Tap first video card ───────────────────────────────────────────
- runFlow:
    when:
      visible:
        id: "video-grid-empty"
    commands:
      - assertVisible:
          id: "video-grid-empty"
- runFlow:
    when:
      notVisible:
        id: "video-grid-empty"
    commands:
      - extendedWaitUntil:
          visible:
            id: "video-card-first"
          timeout: 15000
      - tapOn:
          id: "video-card-first"

# ── Verify watch screen rendered ────────────────────────────────────
- extendedWaitUntil:
    visible:
      id: "watch-screen"
    timeout: 10000

# ── Tap the "Queue" tab in TranscriptQueuePanel ────────────────────
# The tabs are: Transcript | Queue | Info.
- tapOn:
    id: "tab-queue"
    optional: true

# ── Assert watch screen is still visible ────────────────────────────
- assertVisible:
    id: "watch-screen"

# ── Return to Explore for sequencer chainability ────────────────────
- tapOn:
    id: "header-logo"
