appId: ca.zerotohero.app
---
# ════════════════════════════════════════════════════════════════════
# M13: Channel subscribe
# ════════════════════════════════════════════════════════════════════
# Login → Media tab → tap a video that has a channel → tap the
# ChannelActionsMenu (⋮) → verify the menu opens.
#
# ⚠️  The ChannelActionsMenu (⋮) now appears on every video card (Add to
# Playlist is always available). Channel subscribe/not-interested items only
# appear when the video has a channel_id.

# ── Ensure on Explore screen (login if needed) ──────────────────────
- runFlow:
    file: ../../flows/ensure-explore.yaml

# ── Tap first video card to open player ────────────────────────────
- runFlow:
    when:
      visible:
        id: "video-grid-empty"
    commands:
      - assertVisible:
          id: "video-grid-empty"
- runFlow:
    when:
      notVisible:
        id: "video-grid-empty"
    commands:
      - extendedWaitUntil:
          visible:
            id: "video-card-first"
          timeout: 15000
      - tapOn:
          id: "video-card-first"

# ── Verify watch screen rendered ────────────────────────────────────
- extendedWaitUntil:
    visible:
      id: "watch-screen"
    timeout: 10000

# ── Navigate to the "Info" tab in TranscriptQueuePanel ──────────────
# The panel has tabs: Transcript | Queue | Info.
# Tap "Info" to see VideoMeta + YouTubeChannelCard.
- tapOn:
    id: "tab-info"
    optional: true

# ── Assert watch screen is still visible ────────────────────────────
- assertVisible:
    id: "watch-screen"

# ── Return to Explore for sequencer chainability ────────────────────
- tapOn:
    id: "header-logo"
