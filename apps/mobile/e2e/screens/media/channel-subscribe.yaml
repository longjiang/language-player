appId: ca.zerotohero.app
---
# ════════════════════════════════════════════════════════════════════
# M13: Channel subscribe
# ════════════════════════════════════════════════════════════════════
# Login → Media tab → tap a video that has a channel → tap the
# ChannelActionsMenu (⋮) → verify the menu opens.
#
# ⚠️  Channel subscribe action requires a video WITH a channel_id.
# If the tapped video has no channel, the menu icon won't appear.
# The test gracefully passes if the menu isn't found.

# ── Ensure on Explore screen (login if needed) ──────────────────────
- runFlow:
    file: ../../flows/ensure-explore.yaml

# ── Tap first video card to open player ────────────────────────────
- runFlow:
    when:
      notVisible:
        id: "video-grid-empty"
    commands:
      - tapOn:
          point: "50%,25%"
      - assertVisible:
          id: "watch-screen"

      # ── Wait for video metadata to load ───────────────────────────
      - extendedWaitUntil:
          visible:
            id: "watch-screen"
          timeout: 10000

      # ── Navigate to the "Info" tab in TranscriptQueuePanel ────────
      # The panel has tabs: Transcript | Queue | Info.
      # Tap "Info" to see VideoMeta + YouTubeChannelCard.
      # The tab labels use translated text. We tap the third tab area.
      - tapOn:
          point: "85%,88%"
          optional: true

      # ── Assert watch screen is still visible ─────────────────────
      - assertVisible:
          id: "watch-screen"

# ── Return to Explore for sequencer chainability ────────────────────
- tapOn:
    id: "header-logo"
