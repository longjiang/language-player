appId: ca.zerotohero.go
---
# ════════════════════════════════════════════════════════════════════
# M3: Explore infinite scroll / pagination
# ════════════════════════════════════════════════════════════════════
# Login → Media tab → scroll down the video grid → verify the
# screen doesn't crash and more content loads (or end-of-list).

# ── Ensure on Explore screen (login if needed) ──────────────────────
- runFlow:
    file: ../../flows/ensure-explore.yaml

# ── Wait for feed ──────────────────────────────────────────────────
- assertVisible:
    id: "explore-screen"

# ── Scroll down to trigger pagination ──────────────────────────────
# Scroll from near the bottom of the visible area upward to trigger
# onEndReached in the FlatList.
- swipe:
    start: "50%,80%"
    end: "50%,30%"
    duration: 500

# ── Wait briefly for next page to load ─────────────────────────────
- extendedWaitUntil:
    visible:
      id: "explore-screen"
    timeout: 5000

# ── Assert screen is still visible (no crash, no error) ─────────────
- assertVisible:
    id: "explore-screen"

# ── Return to Explore for sequencer chainability ────────────────────
- tapOn:
    id: "header-logo"
