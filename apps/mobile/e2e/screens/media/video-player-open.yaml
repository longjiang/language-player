appId: ca.zerotohero.app
---
# ════════════════════════════════════════════════════════════════════
# M4: Video player — open from explore feed
# ════════════════════════════════════════════════════════════════════
# Login → Media tab → tap the first video card → verify the watch
# screen loads (video meta, subtitle area, or loading spinner visible).

# ── Ensure on Explore screen (login if needed) ──────────────────────
- runFlow:
    file: ../../flows/ensure-explore.yaml

# ── Tap the first video card ───────────────────────────────────────
- runFlow:
    when:
      visible:
        id: "video-grid-empty"
    commands:
      - assertVisible:
          id: "video-grid-empty"
- runFlow:
    when:
      notVisible:
        id: "video-grid-empty"
    commands:
      - extendedWaitUntil:
          visible:
            id: "video-card-first"
          timeout: 15000
      - tapOn:
          id: "video-card-first"

# ── Verify watch screen rendered (top-level — visible in output) ───
# optional: true = won't fail if Fabric blocks testIDs on pushed screens
- extendedWaitUntil:
    visible:
      id: "watch-screen"
    timeout: 10000
    optional: true
- extendedWaitUntil:
    notVisible:
      id: "explore-screen"
    timeout: 10000
- assertVisible:
    id: "header-logo"

# ── Return to Explore for sequencer chainability ────────────────────
- tapOn:
    id: "header-logo"
