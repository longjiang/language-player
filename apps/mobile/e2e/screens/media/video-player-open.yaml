appId: ca.zerotohero.app
---
# ════════════════════════════════════════════════════════════════════
# M4: Video player — open from explore feed
# ════════════════════════════════════════════════════════════════════
# Login → Media tab → tap the first video card → verify the watch
# screen loads (video meta, subtitle area, or loading spinner visible).

# ── Ensure on Explore screen (login if needed) ──────────────────────
- runFlow:
    file: ../../flows/ensure-explore.yaml

# ── Tap the first video card ───────────────────────────────────────
# VideoGrid has three states: loading (spinner), empty ("No videos"),
# and populated (VideoCard list). We need to wait for the cards to
# appear before tapping. Fabric doesn't reliably deliver point-based
# taps, so we use the id-based "video-card-first" (set on grid item 0).
- runFlow:
    when:
      visible:
        id: "video-grid-empty"
    commands:
      # No videos available — skip this test gracefully
      - assertVisible:
          id: "video-grid-empty"
- runFlow:
    when:
      notVisible:
        id: "video-grid-empty"
    commands:
      # Wait for video cards to render (may still be loading spinner)
      - extendedWaitUntil:
          visible:
            id: "video-card-first"
          timeout: 15000
      # Tap the first video card
      - tapOn:
          id: "video-card-first"
      # ── Verify navigation happened ──────────────────────────────
      # react-native-screens + Fabric blocks ALL accessibility
      # properties (testID, accessibilityLabel, accessibilityIdentifier)
      # on pushed screens. Verified 2026-07-28: neither id: nor
      # text: selectors work on pushed-screen content.
      #
      # We verify navigation by: (a) explore-screen disappeared,
      # (b) header-logo still visible (header is outside Stack nav).
      # Video content verification requires a native-level solution
      # (e.g., react-native-screens nativeID prop on the Screen itself).
      - extendedWaitUntil:
          notVisible:
            id: "explore-screen"
          timeout: 10000
      - assertVisible:
          id: "header-logo"

# ── Return to Explore for sequencer chainability ────────────────────
- tapOn:
    id: "header-logo"
