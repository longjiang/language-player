appId: ca.zerotohero.go
---
# ════════════════════════════════════════════════════════════════════
# M7: Video search
# ════════════════════════════════════════════════════════════════════
# Login → Media tab → tap search icon → type query → assert results
# or no-results state (both are valid — depends on test data).

# ── Ensure on Explore screen (login if needed) ──────────────────────
- runFlow:
    file: ../../flows/ensure-explore.yaml

# ── Tap search icon in header ──────────────────────────────────────
- tapOn:
    id: "header-search-button"

# ── Type a search query ────────────────────────────────────────────
- assertVisible:
    id: "search-input"
- tapOn:
    id: "search-input"
    repeat: 3
- inputText: "hello"

# Submit via keyboard Enter key (search input has onSubmitEditing)
- pressKey: Enter

# ── Assert results or no-results state ──────────────────────────────
# After search, either video results appear or a "no results" message.
# Both are valid — the key is that the search completed without error.
- extendedWaitUntil:
    visible:
      id: "search-input"
    timeout: 10000
- assertVisible:
    id: "search-input"

# ── Return to Explore for sequencer chainability ────────────────────
- tapOn:
    id: "header-logo"
