appId: ca.zerotohero.app
---
# ════════════════════════════════════════════════════════════════════
# M5: Subtitle interaction — tap a word in subtitles
# ════════════════════════════════════════════════════════════════════
# Login → Media tab → tap first video → wait for subtitles to load →
# tap a word token in the subtitle area → assert dictionary popup opens.
#
# ⚠️  This test requires a video WITH subtitles. If the selected
# video has no subtitles, the popup assertion is optional.

# ── Ensure on Explore screen (login if needed) ──────────────────────
- runFlow:
    file: ../../flows/ensure-explore.yaml

# ── Tap first video card → verify watch screen ─────────────────────
- runFlow:
    when:
      visible:
        id: "video-grid-empty"
    commands:
      - assertVisible:
          id: "video-grid-empty"
- runFlow:
    when:
      notVisible:
        id: "video-grid-empty"
    commands:
      - extendedWaitUntil:
          visible:
            id: "video-card-first"
          timeout: 15000
      - tapOn:
          id: "video-card-first"
- extendedWaitUntil:
    visible:
      id: "watch-screen"
    timeout: 10000
- extendedWaitUntil:
    notVisible:
      id: "explore-screen"
    timeout: 10000

# ── Wait for subtitles to load ──────────────────────────────────────
# SubtitleDisplay passes testID="subtitle-line-0" to the first line's
# TokenizedText container. Waiting for this ID confirms the first
# subtitle line rendered (instead of a loose text regex).
- extendedWaitUntil:
    visible:
      id: "subtitle-line-0"
    timeout: 15000
    optional: true

# ── Tap a word in the subtitle area ─────────────────────────────────
# Subtitle words are dynamic tokens — but TokenizedText now adds
# testID="token-0", "token-1", ... to each tappable word element.
# Tap the first word of the current subtitle line.
# optional: true = skip silently if no subtitles loaded.
- tapOn:
    id: "token-0"
    optional: true

# ── Assert dictionary popup opened ──────────────────────────────────
# DictionaryPopup renders with testID="dictionary-popup".
# The popup opens when any tappable word in the subtitle is pressed.
- extendedWaitUntil:
    visible:
      id: "dictionary-popup"
    timeout: 5000
    optional: true

# ── Return to Explore for sequencer chainability ────────────────────
- tapOn:
    id: "header-logo"
