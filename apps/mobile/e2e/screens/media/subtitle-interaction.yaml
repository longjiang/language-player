appId: ca.zerotohero.app
---
# ════════════════════════════════════════════════════════════════════
# M5: Subtitle interaction — tap a word in subtitles
# ════════════════════════════════════════════════════════════════════
# Login → Media tab → tap video → wait for subtitles to load →
# tap a word token → assert dictionary popup opens.
#
# ⚠️  This test requires a video WITH subtitles. If the selected
# video has no subtitles, the test assertion may fail gracefully.
# Mitigation: use `optional: true` on subtitle-dependent assertions.

# ── Ensure on Explore screen (login if needed) ──────────────────────
- runFlow:
    file: ../../flows/ensure-explore.yaml

# ── Tap first video card ───────────────────────────────────────────
- runFlow:
    when:
      notVisible:
        id: "video-grid-empty"
    commands:
      - tapOn:
          point: "50%,25%"
      - assertVisible:
          id: "watch-screen"

      # ── Wait for subtitles to load ────────────────────────────────
      # The subtitle display renders TokenizedText with tappable words.
      # Give the Flask server time to return subs (up to 15s timeout).
      - extendedWaitUntil:
          visible:
            text: ".*"
          timeout: 15000
          optional: true

      # ── Tap a word token ─────────────────────────────────────────
      # The subtitle area is below the player. The first tokenized word
      # should be tappable. We tap in the subtitle region.
      - tapOn:
          point: "30%,65%"
          optional: true

      # ── Assert dictionary popup opened ────────────────────────────
      # The DictionaryPopup shows a card with definition text.
      # If the word tap didn't trigger a popup (no subtitles / timing),
      # this assertion is optional.
      - assertVisible:
          text: ".*"
          optional: true

# ── Return to Explore for sequencer chainability ────────────────────
- tapOn:
    id: "header-logo"
