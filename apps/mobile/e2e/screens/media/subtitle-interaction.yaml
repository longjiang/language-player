appId: ca.zerotohero.app
---
# ════════════════════════════════════════════════════════════════════
# M5: Subtitle interaction — tap a word in subtitles
# ════════════════════════════════════════════════════════════════════
# Login → Media tab → tap first video → wait for subtitles to load →
# tap a word token in the subtitle area → assert dictionary popup opens.
#
# ⚠️  This test requires a video WITH subtitles. If the selected
# video has no subtitles, the popup assertion is optional.

# ── Ensure on Explore screen (login if needed) ──────────────────────
- runFlow:
    file: ../../flows/ensure-explore.yaml

# ── Tap first video card → verify watch screen ─────────────────────
- runFlow:
    when:
      visible:
        id: "video-grid-empty"
    commands:
      - assertVisible:
          id: "video-grid-empty"
- runFlow:
    when:
      notVisible:
        id: "video-grid-empty"
    commands:
      - extendedWaitUntil:
          visible:
            id: "video-card-first"
          timeout: 15000
      - tapOn:
          id: "video-card-first"
- extendedWaitUntil:
    visible:
      id: "watch-screen"
    timeout: 10000
- extendedWaitUntil:
    notVisible:
      id: "explore-screen"
    timeout: 10000

# ── Subtitle interaction (only if video has subtitles) ──────────────
# By this point, the video API call has completed (we've waited for
# watch-screen to appear and explore-screen to disappear — up to 20s).
# If the video has subtitles, they're already rendered in the DOM.
#
# Gating the entire interaction behind a when: visible check eliminates
# warnings: if subtitle-line-0 isn't visible, the tap and popup
# assertion are skipped silently with no ⚠️ output. If it IS visible,
# the interaction runs normally with real pass/fail assertions.
- runFlow:
    when:
      visible:
        id: "subtitle-line-0"
    commands:
      # Tap the first word token in the subtitle area.
      # TokenizedText adds testID="token-0", "token-1", ... to every
      # token element (both word and non-word tokens).
      - tapOn:
          id: "token-0"
      # DictionaryPopup renders with testID="dictionary-popup".
      # The popup opens when any tappable word in the subtitle is pressed.
      - extendedWaitUntil:
          visible:
            id: "dictionary-popup"
          timeout: 5000

# ── Return to Explore for sequencer chainability ────────────────────
- tapOn:
    id: "header-logo"
