appId: ca.zerotohero.app
---
# ════════════════════════════════════════════════════════════════════
# M11: Music tab
# ════════════════════════════════════════════════════════════════════
# Login → navigate to Music via hamburger drawer → assert video
# cards or loading state appear.

# ── Ensure on Explore screen (login if needed) ──────────────────────
- runFlow:
    file: ../../flows/ensure-explore.yaml

# ── Open hamburger drawer ──────────────────────────────────────────
- tapOn:
    id: "header-hamburger-button"

# ── Tap "Music" in the drawer ──────────────────────────────────────
- runFlow:
    when:
      notVisible:
        text: "Music"
    commands:
      - scrollUntilVisible:
          element:
            text: "Music"
          direction: DOWN
          timeout: 3000
          speed: 40
- tapOn:
    text: "Music"

# ── Assert Music screen renders ────────────────────────────────────
# The screen title uses t('title.music_and_entertainment')
- extendedWaitUntil:
    visible:
      text: "Music"
    timeout: 10000
- assertVisible:
    text: "Music"

# ── Return to Explore for sequencer chainability ────────────────────
- tapOn:
    id: "header-logo"
