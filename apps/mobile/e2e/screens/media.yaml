appId: ca.zerotohero.app
---
# ════════════════════════════════════════════════════════════════════
# Tier 2 — Media Tab (M1–M16)
# ════════════════════════════════════════════════════════════════════
#
# ⚠️  Order matters — tests are interdependent due to iOS Keychain
# persistence. Run from a CLEAN simulator state:
#   xcrun simctl uninstall booted ca.zerotohero.app
#   xcrun simctl install booted <path>/ZeroToHero.app
#
# Each test file is independently runnable:
#   maestro test e2e/screens/media/<file>.yaml
#
# M6 (karaoke mode) is 🧑 human — excluded.
# ════════════════════════════════════════════════════════════════════

# ── Login once, land on Explore ────────────────────────────────────
- runFlow:
    file: ../flows/ensure-explore.yaml

# ── M1–M3: Explore ─────────────────────────────────────────────────
- runFlow:
    file: media/explore-feed.yaml
- runFlow:
    file: media/level-filter.yaml
- runFlow:
    file: media/explore-pagination.yaml

# ── M4–M5: Watch ───────────────────────────────────────────────────
- runFlow:
    file: media/video-player-open.yaml
- runFlow:
    file: media/subtitle-interaction.yaml

# ── M7–M8: Search ──────────────────────────────────────────────────
- runFlow:
    file: media/video-search.yaml
- runFlow:
    file: media/youtube-url-search.yaml

# ── M9–M12: Browse (drawer nav) ────────────────────────────────────
- runFlow:
    file: media/tv-shows.yaml
- runFlow:
    file: media/live-tv.yaml
- runFlow:
    file: media/music.yaml
- runFlow:
    file: media/watch-history.yaml

# ── M15–M16: Search edge cases ─────────────────────────────────────
- runFlow:
    file: media/search-no-results.yaml
- runFlow:
    file: media/search-tag-cloud.yaml

# ── M13–M14: Watch interactions ────────────────────────────────────
- runFlow:
    file: media/channel-subscribe.yaml
- runFlow:
    file: media/video-queue.yaml
