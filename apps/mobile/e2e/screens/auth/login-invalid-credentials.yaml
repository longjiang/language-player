appId: ca.zerotohero.go
env:
  FLOW: "A2"
---
# ════════════════════════════════════════════════════════════════════
# A2: Login — invalid credentials
#
# Test that an incorrect password shows an error and stays on the
# login screen. Runs as a self-contained independent test.
# ════════════════════════════════════════════════════════════════════

# ── Preflight: ensure login screen ──────────────────────────────────
- runFlow:
    file: ../../flows/preflight-check.yaml

# ── Fill in wrong credentials ──────────────────────────────────────
- tapOn:
    id: "login-email-input"
- eraseText
- inputText: "tester.mary@zerotohero.ca"
- tapOn:
    id: "login-password-input"
- eraseText
- inputText: "wrongpassword123"

# Dismiss keyboard before tapping sign-in
- tapOn:
    id: "dismiss-keyboard"
- tapOn:
    id: "login-signin-button"

# ── Assert: error shown, stay on login screen ──────────────────────
- assertVisible:
    text: "Invalid credentials"
- assertVisible:
    id: "login-email-input"
