appId: ca.zerotohero.app
env:
  FLOW: "A5"
---
# ════════════════════════════════════════════════════════════════════
# A5: Register — password mismatch (client-side validation)
#
# Test that mismatched confirm-password shows "Passwords do not match"
# and the user stays on the register screen.
# ════════════════════════════════════════════════════════════════════

# ── Preflight: ensure login screen ──────────────────────────────────
- runFlow:
    file: ../../flows/preflight-check.yaml

# ── Navigate to register screen ────────────────────────────────────
- runFlow:
    file: ../../flows/navigate-to-register.yaml

# ── Fill fields with mismatched passwords ──────────────────────────
- tapOn:
    id: "register-firstname-input"
- eraseText
- inputText: "E2E"
- tapOn:
    id: "register-lastname-input"
- eraseText
- inputText: "Test"
- tapOn:
    id: "register-email-input"
- eraseText
- inputText: "a5-test@zerotohero.ca"
- tapOn:
    id: "register-password-input"
- eraseText
- inputText: "password123"
- tapOn:
    id: "register-confirm-password-input"
- eraseText
- inputText: "different456"

# Dismiss keyboard before tapping create button
- tapOn:
    id: "dismiss-keyboard"
- tapOn:
    id: "register-create-button"

# ── Assert: error shown, stay on register screen ───────────────────
- assertVisible:
    text: "Passwords do not match"
- assertVisible:
    id: "register-create-button"
