appId: ca.zerotohero.app
env:
  FLOW: "A6"
---
# ════════════════════════════════════════════════════════════════════
# A6: Register — weak password
#
# Test that a short password (< 8 chars) shows an error and the user
# stays on the register screen (no navigation away).
# ════════════════════════════════════════════════════════════════════

# ── Preflight: ensure login screen ──────────────────────────────────
- runFlow:
    file: ../../flows/preflight-check.yaml

# ── Navigate to register screen ────────────────────────────────────
- runFlow:
    file: ../../flows/navigate-to-register.yaml

# ── Fill fields with short password ────────────────────────────────
- tapOn:
    id: "register-password-input"
- eraseText
- inputText: "short"
- tapOn:
    id: "register-confirm-password-input"
- eraseText
- inputText: "short"

# Dismiss keyboard before tapping create button
- tapOn:
    id: "dismiss-keyboard"
- tapOn:
    id: "register-create-button"

# ── Assert: still on register screen (no navigation away) ──────────
# Note: Directus may accept short passwords, so this test verifies
# the register button is still visible (the screen didn't navigate away).
- assertVisible:
    id: "register-create-button"
