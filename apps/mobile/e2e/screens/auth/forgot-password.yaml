appId: ca.zerotohero.go
env:
  FLOW: "A8"
---
# ════════════════════════════════════════════════════════════════════
# A8: Forgot Password
#
# Test the forgot password flow: navigate to forgot password screen,
# enter email, submit, verify success state, and return to login.
# ════════════════════════════════════════════════════════════════════

# ── Preflight: ensure login screen ──────────────────────────────────
- runFlow:
    file: ../../flows/preflight-check.yaml

# ── Navigate to forgot password screen ─────────────────────────────
- tapOn:
    text: "Forgot password?"
- assertVisible:
    id: "forgot-email-input"

# ── Enter email and submit ─────────────────────────────────────────
- tapOn:
    id: "forgot-email-input"
- eraseText
- inputText: "tester.mary@zerotohero.ca"

# Dismiss keyboard before tapping send button
- tapOn:
    id: "dismiss-keyboard"
- tapOn:
    id: "forgot-send-button"

# ── Assert: success state with back-to-login button ────────────────
- assertVisible:
    id: "forgot-back-to-login-button"

# ── Return to login screen ─────────────────────────────────────────
- tapOn:
    id: "forgot-back-to-login-button"
- assertVisible:
    id: "login-email-input"
