appId: ca.zerotohero.app
env:
  FLOW: "A9"
---
# ════════════════════════════════════════════════════════════════════
# A9: Password Reset (deep link)
#
# Test that the password-reset deep link opens the correct screen.
# With an invalid token, the screen shows an error state or the
# reset form — either way, the screen should render (not crash/blank).
# ════════════════════════════════════════════════════════════════════

# ── Preflight: ensure login screen ──────────────────────────────────
- runFlow:
    file: ../../flows/preflight-check.yaml

# ── Open password reset deep link ──────────────────────────────────
- openLink: "languageplayer://password-reset?token=e2e-test-token"

# The password-reset screen shows "Reset your password" as title.
# With an invalid token, the screen shows an error message or the
# reset form. Either way, the screen should render (not crash/blank).
- assertVisible:
    text: "Reset your password"
    optional: true
