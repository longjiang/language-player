appId: ca.zerotohero.app
---
# ════════════════════════════════════════════════════════════════════
# Tier 1 — Auth & Onboarding (A1–A13)
#
# Sequencer: runs each individual test file in order. Each test is
# self-contained with its own preflight and cleanup, so they can also
# be run independently:
#
#   maestro test apps/mobile/e2e/screens/auth/login-happy-path.yaml
#
# ⚠️  Order-dependent for performance on sequential runs — earlier
# tests set up state (register, login) that later tests reuse.
# Each starts with preflight-check that handles any state.
#
# Flow order:
#  1. A2/A3 — validation before any login (clean fields)
#  2. A5-A7 — register validation (no autofill interference)
#  3. A4+A12 — happy path register + onboard new user, then logout
#  4. A8 — forgot password
#  5. A1+A13 — login happy path + session persistence, then logout
#  6. A9, A10 — deep link tests
# ════════════════════════════════════════════════════════════════════

# ── A2: Login — invalid credentials ─────────────────────────────────
- runFlow:
    file: auth/login-invalid-credentials.yaml

# ── A3: Login — empty fields ────────────────────────────────────────
- runFlow:
    file: auth/login-empty-fields.yaml

# ── A5: Register — password mismatch ────────────────────────────────
- runFlow:
    file: auth/register-password-mismatch.yaml

# ── A6: Register — weak password ───────────────────────────────────
- runFlow:
    file: auth/register-weak-password.yaml

# ── A7: Register — duplicate email ─────────────────────────────────
- runFlow:
    file: auth/register-duplicate-email.yaml

# ── A4 + A12: Register happy path + Select Language ─────────────────
- runFlow:
    file: auth/register-and-onboard.yaml

# ── A8: Forgot Password ────────────────────────────────────────────
- runFlow:
    file: auth/forgot-password.yaml

# ── A1 + A13: Login happy path + Session persistence ────────────────
- runFlow:
    file: auth/login-happy-path.yaml

# ── A9: Password Reset (deep link) ──────────────────────────────────
- runFlow:
    file: auth/password-reset-deeplink.yaml

# ── A10: Verify Email (deep link) ──────────────────────────────────
- runFlow:
    file: auth/verify-email-deeplink.yaml
