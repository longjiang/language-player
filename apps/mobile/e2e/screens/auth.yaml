appId: ca.zerotohero.app
env:
  EMAIL: ${FREE_EMAIL}
  PASS: ${FREE_PASS}
---
# ── Preflight: ensure we're on the login screen ──
# If a previous test left the app logged in (iOS Keychain survives
# app deletion), log out before running auth tests.
- runFlow:
    file: flows/logout.yaml
    when:
      notVisible:
        id: "login-email-input"

# ── A1: Login — happy path (already covered by smoke)
# ── A2: Login — invalid credentials ────────────────────────────────
- tapOn:
    id: "login-email-input"
- eraseText
- inputText: ${EMAIL}
- tapOn:
    id: "login-password-input"
- eraseText
- inputText: wrongpassword123
- tapOn:
    id: "login-signin-button"
- assertVisible:
    text: "Invalid"
    optional: true

# ── A5: Register — password mismatch ───────────────────────────────
- tapOn:
    text: "Create Account"
    optional: true
- tapOn:
    id: "register-firstname-input"
    optional: true
- inputText: "E2E"
- tapOn:
    id: "register-lastname-input"
- inputText: "Test"
- tapOn:
    id: "register-email-input"
- inputText: "new@example.com"
- tapOn:
    id: "register-password-input"
- inputText: "password123"
- tapOn:
    id: "register-confirm-password-input"
- inputText: "different456"
- tapOn:
    id: "register-create-button"
- assertVisible:
    text: "not match"
    optional: true

# ── A6: Register — weak password ───────────────────────────────────
# NOTE: eraseText may not work reliably with React Native TextInput
# under Fabric (New Architecture). If this flakes, use longPressOn +
# backspace instead.
- tapOn:
    id: "register-password-input"
- eraseText
- inputText: "short"
- tapOn:
    id: "register-confirm-password-input"
- eraseText
- inputText: "short"
- tapOn:
    id: "register-create-button"
- assertVisible:
    text: "8"
    optional: true

# ── A8: Forgot Password ────────────────────────────────────────────
- tapOn:
    text: "Back"
    optional: true
- tapOn:
    id: "forgot-email-input"
    optional: true
- inputText: ${EMAIL}
- tapOn:
    id: "forgot-send-button"
    optional: true
- assertVisible:
    text: "Check"
    optional: true

# Navigate back to login
- tapOn:
    id: "forgot-back-to-login-button"
    optional: true
