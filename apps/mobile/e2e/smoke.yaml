appId: ca.zerotohero.app
---
# ── Preflight: if app is already logged in from a previous run,
# log out first. On a fresh install this condition is false and
# the flow is skipped. Marked optional so unknown app state
# (splash, language select, crash) doesn't block the test.
- runFlow:
    file: flows/logout.yaml
    when:
      notVisible:
        id: "login-email-input"
    optional: true

# ── S1: App launch → login screen visible ──────────────────────────
- assertVisible:
    id: "login-email-input"
- assertVisible:
    id: "login-password-input"
- assertVisible:
    id: "login-signin-button"

# ── S2: Login → see tabs ──────────────────────────────────────────
- tapOn:
    id: "login-email-input"
- eraseText
- inputText: "tester.mary@zerotohero.ca"
- tapOn:
    id: "login-password-input"
- eraseText
- inputText: "pc8qm8LBZeGuBno"
- tapOn:
    id: "login-signin-button"

# Dismiss iOS "Save Password?" dialog if it appears.
# Retry a few times in case the dialog appears after the first check.
- tapOn:
    text: "Not Now"
    optional: true
    repeat: 3
    waitToSettleTimeoutMs: 2000

# Wait for tabs to appear (header logo visible means logged in)
- assertVisible:
    id: "header-logo"

# Verify hamburger menu opens
- tapOn:
    id: "header-hamburger-button"

# The drawer section headers use translated text "Media", "Reading", "Vocab"
# via t('nav.media'), t('nav.reading'), t('nav.vocab')
- assertVisible:
    text: "Media"
- assertVisible:
    text: "Reading"
- assertVisible:
    text: "Vocab"

# Close drawer by tapping outside it (left side of screen)
- tapOn:
    point: "10%,50%"

# ── S3: Language state ────────────────────────────────────────────
# After login the user lands on the profile (Me) page. Verify we're
# on the profile page and menu handles language info.
- assertVisible:
    id: "me-logout-button"

# ── S4: Logout ─────────────────────────────────────────────────────
- tapOn:
    id: "me-logout-button"
- assertVisible:
    id: "login-email-input"
