appId: ca.zerotohero.app
---
# ════════════════════════════════════════════════════════════════════
# Tier 0 — Smoke Test (pre-commit gate, ~30s)
# ════════════════════════════════════════════════════════════════════
#
# S1: App launch → login screen visible
# S2: Login → tabs render, hamburger drawer opens
# S3: Language state → Me screen shows logout button
# S4: Logout → returns to login screen
#
# ⚠️  Run from a CLEAN simulator state for reliable results:
#   xcrun simctl uninstall booted ca.zerotohero.app
#   xcrun simctl install booted <path>/ZeroToHero.app
# ════════════════════════════════════════════════════════════════════

# ── Preflight: if app is already logged in from a previous run,
# log out first. On a fresh install this condition is false and
# the flow is skipped. Marked optional so unknown app state
# (splash, language select, crash) doesn't block the test.
- runFlow:
    file: flows/logout.yaml
    when:
      notVisible:
        id: "login-email-input"
    optional: true

# ── S1: App launch → login screen visible ──────────────────────────
- assertVisible:
    id: "login-email-input"
- assertVisible:
    id: "login-password-input"
- assertVisible:
    id: "login-signin-button"

# ── S2: Login → see tabs ──────────────────────────────────────────
- runFlow:
    file: flows/login.yaml

# Verify hamburger menu opens and shows nav sections
- tapOn:
    id: "header-hamburger-button"

# The drawer section headers use translated text "Media", "Reading", "Vocab"
# via t('nav.media'), t('nav.reading'), t('nav.vocab')
- assertVisible:
    text: "Media"
- assertVisible:
    text: "Reading"
- assertVisible:
    text: "Vocab"

# Close drawer by tapping outside it (left side of screen)
- tapOn:
    point: "10%,50%"

# ── S3: Language state ────────────────────────────────────────────
# Verify we're on the Me screen with logout button visible.
- assertVisible:
    id: "me-logout-button"

# ── S4: Logout ─────────────────────────────────────────────────────
- tapOn:
    id: "me-logout-button"
- assertVisible:
    id: "login-email-input"
