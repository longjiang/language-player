appId: ca.zerotohero.app
env:
  EMAIL: ${FREE_EMAIL}
  PASS: ${FREE_PASS}
---
# ── Preflight: ensure we're on the login screen ───────────────────
# If a previous test left the app logged in (iOS Keychain token
# survives app relaunch), log out first.
- runFlow:
    file: flows/logout.yaml
    when:
      notVisible:
        id: "login-email-input"

# ── S1: App launch → login screen visible ──────────────────────────
- assertVisible:
    id: "login-email-input"
- assertVisible:
    id: "login-password-input"
- assertVisible:
    id: "login-signin-button"

# ── S2: Login → see tabs ──────────────────────────────────────────
- tapOn:
    id: "login-email-input"
- eraseText
- inputText: ${EMAIL}
- tapOn:
    id: "login-password-input"
- eraseText
- inputText: ${PASS}
- tapOn:
    id: "login-signin-button"

# Dismiss iOS "Save Password?" dialog if it appears
- tapOn:
    text: "Not Now"
    optional: true

# Wait for tabs to appear (header logo visible means logged in)
- assertVisible:
    id: "header-logo"

# Verify hamburger menu opens
- tapOn:
    id: "header-hamburger-button"
- assertVisible:
    text: "Media"
- assertVisible:
    text: "Reading"
- assertVisible:
    text: "Vocab"

# Close drawer by tapping the overlay.
# NOTE: 10%,50% assumes the drawer ≤ 10% of screen width. On iPad
# (Min(256, width*0.6)), 10% may land inside the drawer. If this
# flakes, add a testID to the drawer overlay instead.
- tapOn:
    point: "10%,50%"

# ── S3: Navigate to Me tab via hamburger ──────────────────────────
- tapOn:
    id: "header-hamburger-button"
- tapOn:
    text: "Me"
- assertVisible:
    id: "me-logout-button"

# ── S4: Logout ─────────────────────────────────────────────────────
- tapOn:
    id: "me-logout-button"
- assertVisible:
    id: "login-email-input"
