appId: ca.zerotohero.app
---
# ── Preflight: if app is already logged in from a previous run,
# log out first. On a fresh install this condition is false and
# the flow is skipped. Marked optional so unknown app state
# (splash, language select, crash) doesn't block the test.
- runFlow:
    file: flows/logout.yaml
    when:
      notVisible:
        id: "login-email-input"
    optional: true

# ── S1: App launch → login screen visible ──────────────────────────
- assertVisible:
    id: "login-email-input"
- assertVisible:
    id: "login-password-input"
- assertVisible:
    id: "login-signin-button"

# ── S2: Login → see tabs ──────────────────────────────────────────
- tapOn:
    id: "login-email-input"
- eraseText
- inputText: "tester.mary@zerotohero.ca"
- tapOn:
    id: "login-password-input"
- eraseText
- inputText: "pc8qm8LBZeGuBno"
- tapOn:
    id: "login-signin-button"

# Dismiss iOS "Save Password?" dialog if it appears
- tapOn:
    text: "Not Now"
    optional: true

# Wait for tabs to appear (header logo visible means logged in)
- assertVisible:
    id: "header-logo"

# Verify hamburger menu opens
- tapOn:
    id: "header-hamburger-button"
- assertVisible:
    text: "Media"
- assertVisible:
    text: "Reading"
- assertVisible:
    text: "Vocab"

# Close drawer
- tapOn:
    point: "10%,50%"

# ── S3: Navigate to Me tab via hamburger ──────────────────────────
- tapOn:
    id: "header-hamburger-button"
- tapOn:
    text: "Me"
- assertVisible:
    id: "me-logout-button"

# ── S4: Logout ─────────────────────────────────────────────────────
- tapOn:
    id: "me-logout-button"
- assertVisible:
    id: "login-email-input"
