<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Language Player</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>
      <img src="language-player-logo-64.png" alt="" width="28" height="28" />
      <span id="popup-title">Language Player</span>
    </h1>

    <!-- Language picker -->
    <section id="language-section">
      <div class="lang-header">
        <span id="lang-title"></span>
        <button id="lang-toggle-btn"></button>
      </div>
      <div id="lang-summary" class="lang-summary"></div>

      <div id="lang-picker" class="hidden">
        <div class="lpv-modal-columns">
          <!-- L1: I speak -->
          <div class="lpv-modal-column">
            <div class="lpv-modal-column-header">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lpv-icon-primary"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
              <h3 id="lang-l1-title"></h3>
            </div>
            <div class="lpv-modal-search">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lpv-search-icon"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
              <input id="lang-l1-search" type="text" class="lpv-modal-search-input" />
            </div>
            <div id="lang-l1-list" class="lpv-modal-list"></div>
          </div>

          <!-- Arrow separator -->
          <div class="lpv-modal-arrow-col">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lpv-icon-muted"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
          </div>

          <!-- L2: I'm learning -->
          <div class="lpv-modal-column">
            <div class="lpv-modal-column-header">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lpv-icon-primary"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
              <h3 id="lang-l2-title"></h3>
            </div>
            <div class="lpv-modal-search">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lpv-search-icon"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
              <input id="lang-l2-search" type="text" class="lpv-modal-search-input" />
            </div>
            <div id="lang-l2-list" class="lpv-modal-list"></div>
          </div>
        </div>

        <div class="lpv-modal-footer">
          <span id="lang-selection" class="lpv-modal-selection"></span>
          <button id="lang-confirm-btn" class="lpv-modal-confirm-btn"></button>
        </div>
      </div>
    </section>

    <!-- Auth section -->
    <div id="auth-section">
      <div id="auth-logged-out">
        <p class="auth-hint" id="popup-login-prompt"></p>
        <input type="email" id="auth-email" />
        <input type="password" id="auth-password" />
        <button id="auth-login-btn"></button>
        <p id="auth-error" class="auth-error hidden"></p>
      </div>
      <div id="auth-logged-in" class="hidden">
        <span id="auth-user"></span>
        <button id="auth-logout-btn"></button>
      </div>
    </div>

    <!-- Instructions -->
    <div id="instructions">
      <p id="popup-instructions"></p>
      <ul>
        <li id="popup-click-word"></li>
        <li id="popup-save-words"></li>
        <li id="popup-toggle-shortcut"></li>
      </ul>
    </div>

    <!-- Transcript toggle -->
    <button id="transcript-btn" class="hidden" disabled></button>
    <p id="transcript-hint" class="hidden"></p>

    <!-- Open in Language Player -->
    <button id="open-in-web-btn" class="hidden"></button>
    <p id="open-web-warn" class="hidden"></p>

  </div>
  <script src="../dist/popup-options.js"></script>
  <script src="../dist/popup.js"></script>
</body>
</html>
