[build]
  command = "npm install && npx turbo build --filter=@langplayer/web"
  publish = "apps/web/.next"
  base = "/"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/python/*"
  to = "https://pythonvps.zerotohero.ca/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/directus/*"
  to = "https://directusvps.zerotohero.ca/zerotohero/:splat"
  status = 200
  force = true

# Legacy iOS Capacitor wrapper (server.url = languageplayer.io): when the
# webview sets lp_legacy, proxy the whole origin to the Classic Nuxt app on
# v2.languageplayer.io. A 200 rewrite keeps the navigation inside the webview;
# a cross-origin redirect would be handed to Safari by Capacitor's policy.
# Must stay after the /api/* rules so API traffic is unaffected.
[[redirects]]
  from = "/*"
  to = "https://v2.languageplayer.io/:splat"
  status = 200
  force = true
  conditions = { Cookie = ["lp_legacy"] }

[[plugins]]
  package = "@netlify/plugin-nextjs"
